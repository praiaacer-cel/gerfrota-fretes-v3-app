name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          mkdir -p $ANDROID_SDK_ROOT
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          fi
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        shell: bash
        
      - name: Execute Python script and ensure Gradle Wrapper
        run: |
          echo " Executando script Python para preparar o projeto..."
          python3 criar_gerfrota_fretes_v3.py
          
          echo "🔍 Verificando estrutura de arquivos gerada..."
          ls -la
          
          if [ ! -d "./GerFrotaFretesApp" ]; then
            echo " ERRO CRÍTICO: O diretório 'GerFrotaFretesApp' não foi criado pelo script Python!"
            exit 1
          fi
          
          if [ ! -f "./GerFrotaFretesApp/gradlew" ]; then
            echo "⚠️ 'gradlew' não encontrado. Gerando wrapper do Gradle automaticamente..."
            mkdir -p ./GerFrotaFretesApp/gradle/wrapper
            cd ./GerFrotaFretesApp
            
            echo '#!/bin/sh' > gradlew
            echo 'APP_HOME=$(cd "$(dirname "$0")" && pwd)' >> gradlew
            echo 'CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"' >> gradlew
            echo 'if [ ! -f "$CLASSPATH" ]; then' >> gradlew
            echo '  echo "ERROR: gradle-wrapper.jar não encontrado"' >> gradlew
            echo '  exit 1' >> gradlew
            echo 'fi' >> gradlew
            echo 'exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
            
            curl -sL "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
            
            if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "❌ Falha ao baixar gradle-wrapper.jar (arquivo vazio ou inexistente)"
              exit 1
            fi
            
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            
            cd ..
            echo "✅ Wrapper do Gradle gerado e configurado com sucesso!"
          else
            echo "✅ 'gradlew' já existe. Garantindo permissão de execução..."
            chmod +x ./GerFrotaFretesApp/gradlew
          fi
          
          echo "✅ Estrutura do projeto pronta para compilação!"
        working-directory: .
        
      # ✅ OPÇÃO B: Gerar keystore de debug e configurar assinatura no release
      - name: Generate Debug Keystore for Release Signing
        run: |
          echo "🔐 Gerando keystore de debug para assinatura do release..."
          
          # Gerar keystore de debug
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # Mover para o diretório do app
          mv debug.keystore GerFrotaFretesApp/
          
          # Criar arquivo de propriedades do keystore
          cat > GerFrotaFretesApp/keystore.properties << EOF
storePassword=android
keyPassword=android
keyAlias=androiddebugkey
storeFile=debug.keystore
EOF
          
          echo "✅ Keystore de debug gerado com sucesso!"
          
      # ✅ OPÇÃO B: Modificar build.gradle.kts para usar signingConfig no release
      - name: Configure Release Signing in build.gradle.kts
        run: |
          echo "⚙️ Configurando assinatura no release..."
          
          # Adicionar import de Properties no início do arquivo
          sed -i '1s/^/import java.util.Properties\nimport java.io.FileInputStream\n\n/' GerFrotaFretesApp/app/build.gradle.kts
          
          # Adicionar bloco de configuração do keystore antes do android {}
          cat > /tmp/signing_config.txt << 'EOF'
          
          val keystorePropertiesFile = rootProject.file("keystore.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          
          android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          }
          EOF
          
          # Inserir configuração após a linha "android {"
          sed -i '/^android {/r /tmp/signing_config.txt' GerFrotaFretesApp/app/build.gradle.kts
          
          # Adicionar signingConfig no buildType release
          sed -i '/release {/a\            signingConfig = signingConfigs.getByName("release")' GerFrotaFretesApp/app/build.gradle.kts
          
          echo "✅ Configuração de assinatura adicionada ao build.gradle.kts!"
          
      - name: Build Release APK (Clean Build)
        working-directory: GerFrotaFretesApp
        run: ./gradlew clean assembleRelease -Porg.gradle.jvmargs="-Xmx2048m"
        
      - name: Show generated APKs
        working-directory: GerFrotaFretesApp
        run: |
          echo ">> Arquivos APK no diretório de saída:"
          ls -lh app/build/outputs/apk/release || true
          
      - name: Select and Verify APK
        working-directory: GerFrotaFretesApp
        run: |
          echo "🔍 Validando o arquivo APK antes do upload..."
          
          # Selecionar o APK de release (já assinado pela configuração do build.gradle.kts)
          release_apk=$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null | head -n1 || true)
          
          if [ -n "$release_apk" ]; then
            echo "APK_TO_UPLOAD=$(pwd)/$release_apk" >> $GITHUB_ENV
            echo "✅ APK selecionado (Release assinado): $release_apk"
            ls -lh "$release_apk"
            
            # Verificar se o APK está assinado
            if jarsigner -verify -verbose "$release_apk" 2>&1 | grep -q "jar verified"; then
              echo "✅ APK está assinado e verificado!"
            else
              echo "⚠️ Aviso: APK pode não estar assinado corretamente"
            fi
            
            exit 0
          fi
          
          echo "❌ Nenhum arquivo app-release.apk encontrado em app/build/outputs/apk/release" >&2
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GerFrota-Fretes-Release-APK
          path: ${{ env.APK_TO_UPLOAD }}
