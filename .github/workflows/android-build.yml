name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          mkdir -p $ANDROID_SDK_ROOT
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          fi
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        shell: bash
        
      - name: Execute Python script and ensure Gradle Wrapper
        run: |
          echo "🚀 Executando script Python para preparar o projeto..."
          python3 criar_gerfrota_fretes_v3.py
          
          echo "🔍 Verificando estrutura de arquivos gerada..."
          ls -la
          
          if [ ! -d "./GerFrotaFretesApp" ]; then
            echo "❌ ERRO CRÍTICO: O diretório 'GerFrotaFretesApp' não foi criado pelo script Python!"
            exit 1
          fi
          
          if [ ! -f "./GerFrotaFretesApp/gradlew" ]; then
            echo "⚠️ 'gradlew' não encontrado. Gerando wrapper do Gradle automaticamente..."
            mkdir -p ./GerFrotaFretesApp/gradle/wrapper
            cd ./GerFrotaFretesApp
            
            # 1. ✅ CORREÇÃO: Usar a branch 'master' para garantir que os arquivos do wrapper existam
            curl -sL https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.sh -o gradlew
            curl -sL https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
            
            # 2. VALIDAÇÃO DE SEGURANÇA: Impede que um erro 404 seja executado como script
            if ! head -1 gradlew | grep -q "#!/bin/sh"; then
              echo "❌ Falha ao baixar gradlew (resposta inválida ou 404 do GitHub)"
              echo "Conteúdo baixado:"
              cat gradlew
              exit 1
            fi
            
            chmod +x gradlew
            
            # 3. Criar propriedades do wrapper (usando echo para evitar erros de indentação do YAML)
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            
            cd ..
            echo "✅ Wrapper do Gradle gerado e configurado com sucesso!"
          else
            echo "✅ 'gradlew' já existe. Garantindo permissão de execução..."
            chmod +x ./GerFrotaFretesApp/gradlew
          fi
          
          echo "✅ Estrutura do projeto pronta para compilação!"
        working-directory: .
        
      - name: Build Release APK
        working-directory: GerFrotaFretesApp
        run: ./gradlew assembleRelease -Porg.gradle.jvmargs="-Xmx2048m"
        
      - name: Optionally sign APK (requires repo secrets)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/Android/Sdk
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "⚠️ Secrets de assinatura não configurados. Pulando etapa de assinatura do APK."
            exit 0
          fi
          
          echo "🔐 Iniciando assinatura do APK..."
          echo "$ANDROID_KEYSTORE" | base64 --decode > release.keystore
          APKSIGNER=$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/apksigner | tail -n 1)
          fi
          unsigned_apk=$(ls app/build/outputs/apk/release/*unsigned*.apk || true)
          if [ -z "$unsigned_apk" ]; then
            unsigned_apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          fi
          if [ -z "$unsigned_apk" ]; then
            echo "❌ Nenhum APK encontrado para assinar" && exit 1
          fi
          $APKSIGNER sign --ks release.keystore --ks-pass pass:$KEYSTORE_PASSWORD --key-pass pass:$KEY_PASSWORD --out ${unsigned_apk%.apk}-signed.apk $unsigned_apk
          echo "✅ APK assinado com sucesso!"
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: GerFrotaFretesApp/app/build/outputs/apk/release/*.apk
