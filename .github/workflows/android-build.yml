**Recommended fix in Python script:**

Add to `criar_gerfrota_fretes_v3.py` before line 2310:

```python
# 36. Create gradle wrapper files
import urllib.request

# Download and include gradlew
try:
    gradlew_url = "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.sh"
    A["gradlew"] = urllib.request.urlopen(gradlew_url).read().decode('utf-8')
except:
    # Fallback minimal wrapper
    A["gradlew"] = "#!/bin/sh\nexec gradle \"$@\"\n"

# gradle/wrapper/gradle-wrapper.properties
A["gradle/wrapper/gradle-wrapper.properties"] = r'''distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
'''
```

Then update the create function to make `gradlew` executable:

```python
# Add after line 2333 (after file creation loop):
import os
import stat

# Make gradlew executable
gradlew_path = os.path.join(PROJETO, "gradlew")
if os.path.exists(gradlew_path):
    st = os.stat(gradlew_path)
    os.chmod(gradlew_path, st.st_mode | stat.S_IEXEC)
    print(f"  [chmod] gradlew executável")
