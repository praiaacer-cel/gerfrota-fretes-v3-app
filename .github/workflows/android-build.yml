name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          export ANDROID_SDK_ROOT=$HOME/Android/Sdk
          mkdir -p $ANDROID_SDK_ROOT
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          fi
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        shell: bash
        
      - name: Execute Python script and ensure Gradle Wrapper
        run: |
          echo "🚀 Executando script Python para preparar o projeto..."
          python3 criar_gerfrota_fretes_v3.py
          
          echo "🔍 Verificando estrutura de arquivos gerada..."
          ls -la
          
          if [ ! -d "./GerFrotaFretesApp" ]; then
            echo "❌ ERRO CRÍTICO: O diretório 'GerFrotaFretesApp' não foi criado pelo script Python!"
            exit 1
          fi
          
          if [ ! -f "./GerFrotaFretesApp/gradlew" ]; then
            echo "⚠️ 'gradlew' não encontrado. Gerando wrapper do Gradle automaticamente..."
            mkdir -p ./GerFrotaFretesApp/gradle/wrapper
            cd ./GerFrotaFretesApp
            
            echo '#!/bin/sh' > gradlew
            echo 'APP_HOME=$(cd "$(dirname "$0")" && pwd)' >> gradlew
            echo 'CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"' >> gradlew
            echo 'if [ ! -f "$CLASSPATH" ]; then' >> gradlew
            echo '  echo "ERROR: gradle-wrapper.jar não encontrado"' >> gradlew
            echo '  exit 1' >> gradlew
            echo 'fi' >> gradlew
            echo 'exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
            chmod +x gradlew
            
            curl -sL "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
            
            if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "❌ Falha ao baixar gradle-wrapper.jar (arquivo vazio ou inexistente)"
              exit 1
            fi
            
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            
            cd ..
            echo "✅ Wrapper do Gradle gerado e configurado com sucesso!"
          else
            echo "✅ 'gradlew' já existe. Garantindo permissão de execução..."
            chmod +x ./GerFrotaFretesApp/gradlew
          fi
          
          echo "✅ Estrutura do projeto pronta para compilação!"
        working-directory: .
        
      # ✅ CORREÇÃO 1: Build limpo (clean) para evitar APKs incrementais/residuais
      - name: Build Release APK (Clean Build)
        working-directory: GerFrotaFretesApp
        run: ./gradlew clean assembleRelease -Porg.gradle.jvmargs="-Xmx2048m"
        
      # ✅ CORREÇÃO 2: Listar arquivos gerados para debug e transparência
      - name: Show generated APKs
        working-directory: GerFrotaFretesApp
        run: |
          echo ">> Arquivos APK no diretório de saída:"
          ls -la app/build/outputs/apk/release || true

      - name: Optionally sign APK (requires repo secrets)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/Android/Sdk
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "⚠️ Secrets de assinatura não configurados. Pulando etapa de assinatura do APK."
            exit 0
          fi
          
          echo "🔐 Iniciando assinatura do APK..."
          echo "$ANDROID_KEYSTORE" | base64 --decode > release.keystore
          APKSIGNER=$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/apksigner | tail -n 1)
          fi
          
          # Procura primeiro por unsigned, senão pega o release padrão
          unsigned_apk=$(ls app/build/outputs/apk/release/*unsigned*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$unsigned_apk" ]; then
            unsigned_apk=$(ls app/build/outputs/apk/release/*release*.apk 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$unsigned_apk" ]; then
            echo "❌ Nenhum APK encontrado para assinar" && exit 1
          fi
          
          signed_apk="${unsigned_apk%.apk}-signed.apk"
          $APKSIGNER sign --ks release.keystore --ks-pass pass:$KEYSTORE_PASSWORD --key-pass pass:$KEY_PASSWORD --out "$signed_apk" "$unsigned_apk"
          echo "✅ APK assinado com sucesso: $signed_apk"

      # ✅ CORREÇÃO 3: Seleção determinística do arquivo correto para upload
      - name: Select APK to upload
        working-directory: GerFrotaFretesApp
        run: |
          # 1. Preferir o APK assinado se existir
          signed=$(ls app/build/outputs/apk/release/*-signed*.apk 2>/dev/null | head -n1 || true)
          if [ -n "$signed" ]; then
            echo "APK_TO_UPLOAD=$signed" >> $GITHUB_ENV
            echo "✅ Usando APK assinado: $signed"
            exit 0
          fi
          
          # 2. Caso contrário, preferir o APK de release padrão
          release_apk=$(ls app/build/outputs/apk/release/*release*.apk 2>/dev/null | head -n1 || true)
          if [ -n "$release_apk" ]; then
            echo "APK_TO_UPLOAD=$release_apk" >> $GITHUB_ENV
            echo "✅ Usando APK de release: $release_apk"
            exit 0
          fi
          
          echo "❌ Nenhum APK válido encontrado em app/build/outputs/apk/release" >&2
          exit 1

      # ✅ CORREÇÃO 4: Upload explícito do arquivo selecionado, com nome claro
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GerFrota-Fretes-Release-APK
          path: ${{ env.APK_TO_UPLOAD }}
