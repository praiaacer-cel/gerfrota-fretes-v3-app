if [ ! -f "$CLASSPATH" ]; then
    echo "ERROR: Gradle wrapper JAR not found in gradle/wrapper/"
    exit 1
fi
exec java $JAVA_OPTS -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
'''

